name: Deploy JSONX renderer to Cloudflare

# Deployment is explicit. Pull requests and source pushes only validate the app.
on:
  workflow_dispatch:
    inputs:
      expected_origin:
        description: Verified Workers origin to smoke-test after deployment (https://...)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-jsonx-renderer
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jsonx-renderer-app
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require existing deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Existing CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN secrets are required. No credentials were created and nothing was deployed."
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/jsonx-renderer-app/package-lock.json
      - name: Install renderer dependencies
        run: npm ci
      - name: Validate renderer and Workers runtime
        run: npm run check
      - name: Validate deployment bundle
        run: npm run deploy:dry-run
      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/jsonx-deploy.jsonl
        run: |
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"
          npm run deploy:worker
      - name: Match smoke origin to the completed deployment
        env:
          EXPECTED_ORIGIN: ${{ inputs.expected_origin }}
          DEPLOY_OUTPUT_FILE: ${{ runner.temp }}/jsonx-deploy.jsonl
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const origin = new URL(process.env.EXPECTED_ORIGIN);
          assert.equal(origin.protocol, "https:", "Smoke origin must use HTTPS");
          assert.equal(origin.username, "", "Smoke origin must not include credentials");
          assert.equal(origin.password, "", "Smoke origin must not include credentials");
          assert.equal(origin.href, `${origin.origin}/`, "Supply an origin without a path, query, or fragment");
          const records = readFileSync(process.env.DEPLOY_OUTPUT_FILE, "utf8")
            .split("\n").filter((line) => line.trim()).map((line) => JSON.parse(line));
          const deployments = records.filter((record) => record.type === "deploy");
          assert.equal(deployments.length, 1, "Expected exactly one completed Wrangler deployment");
          const deployment = deployments[0];
          assert.equal(deployment.version, 1, "Unsupported Wrangler deployment record version");
          assert.equal(deployment.worker_name, "jsonx-renderer-app");
          assert.equal(typeof deployment.version_id, "string", "Missing deployed Worker version");
          assert.ok(deployment.version_id.length > 0, "Missing deployed Worker version");
          assert.ok(deployment.targets?.includes(origin.origin), "Smoke origin is not a target of this deployment");
          console.log(`Verified deployment ${deployment.version_id} at ${origin.origin}`);
          JS
      - name: Verify live endpoint
        env:
          EXPECTED_ORIGIN: ${{ inputs.expected_origin }}
        run: npm run smoke:hosted -- --url "$EXPECTED_ORIGIN"
