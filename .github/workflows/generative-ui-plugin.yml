name: Generative UI Plugin

on:
  push:
    branches:
      - main
    paths:
      - ".agents/plugins/**"
      - ".github/workflows/generative-ui-plugin.yml"
      - "apps/jsonx-renderer-app/**"
      - "docs/intent/generative-ui-plugin/**"
      - "docs/assets/generative-ui.css"
      - "docs/assets/generative-ui-demo.js"
      - "docs/generative-ui.html"
      - "docs/privacy.html"
      - "docs/terms.html"
      - "docs/skills/**"
      - "plugins/**"
      - "site/**"
      - "skills/**"
      - ".npmignore"
  pull_request:
    branches:
      - main
    paths:
      - ".agents/plugins/**"
      - ".github/workflows/generative-ui-plugin.yml"
      - "apps/jsonx-renderer-app/**"
      - "docs/intent/generative-ui-plugin/**"
      - "docs/assets/generative-ui.css"
      - "docs/assets/generative-ui-demo.js"
      - "docs/generative-ui.html"
      - "docs/privacy.html"
      - "docs/terms.html"
      - "docs/skills/**"
      - "plugins/**"
      - "site/**"
      - "skills/**"
      - ".npmignore"
  workflow_dispatch:

jobs:
  validate:
    name: Validate app, plugins, and package boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/jsonx-renderer-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install renderer dependencies
        run: npm ci
        working-directory: apps/jsonx-renderer-app

      - name: Validate plugin package metadata
        run: node plugins/jsonx-generative-ui-plugin/scripts/validate-plugin-package.mjs

      - name: Validate renderer app
        run: npm run check
        working-directory: apps/jsonx-renderer-app

      - name: Validate generative UI fixtures
        run: npm run validate:fixtures
        working-directory: apps/jsonx-renderer-app

      - name: Validate mirrored skill docs
        run: diff -rq skills docs/skills

      - name: Validate external gate evidence template
        run: node docs/intent/generative-ui-plugin/scripts/check-external-gate-evidence.mjs --source docs/intent/generative-ui-plugin/external-gate-evidence.template.json --json

      - name: Validate tracked external gate evidence
        run: node docs/intent/generative-ui-plugin/scripts/check-external-gate-evidence.mjs --json

      - name: Validate external gate recorder
        run: |
          node --check docs/intent/generative-ui-plugin/scripts/record-external-gate-evidence.mjs
          node docs/intent/generative-ui-plugin/scripts/record-external-gate-evidence.mjs --help >/tmp/jsonx-external-gate-recorder-help.txt
          node --check docs/intent/generative-ui-plugin/scripts/validate-external-gate-recorder.mjs
          node docs/intent/generative-ui-plugin/scripts/validate-external-gate-recorder.mjs >/tmp/jsonx-external-gate-recorder-validation.json

      - name: Validate public review kit URLs
        run: node docs/intent/generative-ui-plugin/scripts/check-public-review-kit.mjs --json

      - name: Validate GitHub issue tracking
        run: node docs/intent/generative-ui-plugin/scripts/check-github-issue-tracking.mjs --json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate submission source docs
        run: node docs/intent/generative-ui-plugin/scripts/check-submission-source-docs.mjs --json

      - name: Probe external gate access
        run: node docs/intent/generative-ui-plugin/scripts/check-external-gate-access.mjs --json

      - name: Audit generative UI goal coverage
        run: node docs/intent/generative-ui-plugin/scripts/audit-generative-ui-goal.mjs --json

      - name: Generate submission package artifacts
        run: >
          node docs/intent/generative-ui-plugin/scripts/prepare-submission-artifacts.mjs
          --skip-screenshots
          --skip-hosted-mcp
          --skip-codex-install
          --skip-claude-validation
          --skip-opencode-validation
          --skip-motion-evidence
          --skip-browser-demo
          --output /tmp/jsonx-submission-artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check npm package boundary
        run: |
          npm pack --dry-run --json > /tmp/jsonx-pack-dry-run.json
          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("/tmp/jsonx-pack-dry-run.json", "utf8"));
          const files = data[0].files.map((file) => file.path);
          const blockedPrefixes = [
            "apps/",
            "plugins/",
            "skills/",
            ".agents/",
            ".claude/",
            ".opencode/",
            "docs/intent/",
            "docs/skills/",
            "vscode-extension/",
            ".github/",
          ];
          const blockedTerms = [
            "chatgpt-app-submission",
            "marketplace.json",
            "netlify/",
            "gsap",
            "golden-prompts",
            "hosted-mcp-transcript",
            "skill-installer-evidence",
            "submission-queue",
            "codex-install-evidence",
            "claude-validation-evidence",
            "opencode-skill-evidence",
            "motion-profile-evidence",
            "browser-demo-evidence",
            "source-docs-evidence",
            "submission-audit",
            "external-gate-evidence",
            "openai-plugin-submission",
            "openai-jsonx-plugin-submission",
            "openai-generative-ui-plugin-submission",
            "claude-code-community-submission",
            "claude-code-jsonx-submission",
            "claude-code-generative-ui-submission",
          ];
          const blocked = files.filter(
            (file) =>
              blockedPrefixes.some((prefix) => file.startsWith(prefix)) ||
              blockedTerms.some((term) => file.includes(term)),
          );
          if (blocked.length) {
            throw new Error(`npm pack includes blocked files: ${blocked.join(", ")}`);
          }
          console.log(`npm pack boundary ok: ${files.length} files, ${data[0].size} bytes`);
          NODE

      - name: Upload generated submission package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jsonx-generative-ui-submission-artifacts
          path: /tmp/jsonx-submission-artifacts
